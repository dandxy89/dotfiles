name: check
on: [push, pull_request]
jobs:
  nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version
      - name: Install lua-language-server
        run: |
          url=$(curl -fsSL https://api.github.com/repos/LuaLS/lua-language-server/releases/latest \
            | grep -o 'https://[^"]*linux-x64\.tar\.gz' | head -1)
          mkdir -p "$HOME/lls" && curl -fsSL "$url" | tar -xz -C "$HOME/lls"
          echo "$HOME/lls/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luarocks && sudo luarocks install luacheck
      - run: ./nvim/check.sh
