name: check
on: [push, pull_request]
jobs:
  nvim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version
      - name: Install lua-language-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/lls"
          gh release download -R LuaLS/lua-language-server -p '*linux-x64.tar.gz' -O - | tar -xz -C "$HOME/lls"
          echo "$HOME/lls/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luarocks && sudo luarocks install luacheck
      - name: Install treesitter parsers for tests
        run: |
          sudo npm install -g tree-sitter-cli
          git clone --depth 1 --branch main https://github.com/nvim-treesitter/nvim-treesitter "$HOME/ts"
          nvim --headless --cmd "set rtp+=$HOME/ts" -c 'lua require("nvim-treesitter").install({ "rust", "python" }):wait(300000)' -c q
      - run: ./nvim/check.sh
