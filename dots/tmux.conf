# =============================================================================
# === TMUX CONFIGURATION
# =============================================================================

# Set the prefix to C-s
# IMPORTANT: C-s is often used for XOFF (flow control) in terminals, which
# will "freeze" your terminal. To prevent this, add `stty -ixon` to your
# shell's startup file (e.g., ~/.bashrc or ~/.zshrc).
set -g prefix C-s

# Start window and pane numbering from 1 (also set by tmux-sensible).
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed.
set -g renumber-windows on

# Increase scrollback history limit.
set -g history-limit 10000

# Notify about activity in other windows.
setw -g monitor-activity on
set -g visual-activity on

# Unbind default keys that are not used or will be re-bound.
unbind r

# Reload the tmux configuration with <prefix> r.
bind r source-file ~/.tmux.conf \; display "✅ Reloaded tmux.conf"

# Split panes using | for vertical and - for horizontal splits.
# They will open in the current working directory of the current pane.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate between panes using Vim-style keys (h, j, k, l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Your original binding to switch windows by index.
bind space command-prompt -p "Switch to window:" "select-window -t '%%'"

# Fast pane-switching with Alt+arrow (no prefix needed).
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Don't rename windows automatically — preserve custom names.
set-option -g allow-rename off

# Open new windows in the current pane's path.
bind c new-window -c "#{pane_current_path}"

# Use vi-style keys in copy mode.
set-window-option -g mode-keys vi

# Forward focus events to applications (e.g. nvim autoread).
set -g focus-events on

# True colour + modern terminal type.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Prompt Esc delivery to nvim, and unambiguous modified keys (e.g. C-i vs Tab).
set -sg escape-time 10
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# Ctrl-h/j/k/l: move between nvim splits and tmux panes (nvim side: core/keys.lua).
# Cost: C-l no longer clears the screen in a plain shell pane; use `clear`.
is_vim="#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"

# oxidefox theme (palette from nvim/colors/oxidefox.lua)
# black #282828  sel0 #3A3A3A  sel1 #525253  comment #6B7280  white #DFDFE0
# blue #78A9FF  magenta #BE95FF  orange #FFB14A  green #25be6a  red #EE5396
set -g status-style "fg=#DDDDDD,bg=#333333"
set -g status-left "#[fg=#78A9FF,bold] ▍#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#6B7280]#{?client_prefix,#[fg=#FFB14A#,bold]PREFIX ,}#[fg=#BE95FF]%H:%M #[fg=#78A9FF]#h "
set -g window-status-format "#[fg=#6B7280] #I:#W "
set -g window-status-current-format "#[fg=#FFB14A,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#EE5396"
set -g window-status-bell-style "fg=#EE5396,bold"
set -g pane-border-style "fg=#3A3A3A"
set -g pane-active-border-style "fg=#78A9FF"
set -g message-style "fg=#DFDFE0,bg=#525253"
set -g message-command-style "fg=#DFDFE0,bg=#525253"
set -g mode-style "fg=#DFDFE0,bg=#525253"
set -g display-panes-colour "#6B7280"
set -g display-panes-active-colour "#FFB14A"
setw -g clock-mode-colour "#78A9FF"

set -g mouse on

# Position the status bar at the top of the screen
set -g status-position top

# How to use TPM:
# 1. Clone TPM: `git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm`
# 2. Add plugins to the list below.
# 3. Press `<prefix>I` inside tmux to install plugins.
# 4. Press `<prefix>U` to update, `<prefix>alt-u` to remove.

# Automatically installs TPM if it's not already present.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
# Provides a set of sensible tmux options. Recommended to keep this first.
set -g @plugin 'tmux-plugins/tmux-sensible'
# Plugin for running cargo commands (for Rust development).
set -g @plugin 'idevtier/tmux-cargo'
# Plugin for logging pane content to a file.
set -g @plugin 'tmux-plugins/tmux-logging'
# Plugin saves and restores tmux sessions.
set -g @plugin 'tmux-plugins/tmux-resurrect'

# IMPORTANT: This line must be at the very bottom of the file.
run -b '~/.tmux/plugins/tpm/tpm'
